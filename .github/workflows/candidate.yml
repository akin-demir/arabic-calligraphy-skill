name: Prepare release candidate
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing maintainer-approved version tag
        required: true
        type: string
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    environment: production-release
    steps:
      - name: Validate tag syntax
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python -c 'import os,re; assert re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+(?:-rc\.[0-9]+)?",os.environ["RELEASE_TAG"])'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangocairo-1.0-0 libcairo2 libfontconfig1 libharfbuzz0b
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install --no-deps .
      - run: python scripts/check_project.py
      - run: python scripts/verify_accuracy.py --release
      - run: pip-audit -r requirements-dev.txt
      - run: python scripts/generate_gallery.py
      - run: python -m build --no-isolation
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-candidate
          path: |
            dist/
            reports/
            examples/gallery/
