name: Clean completed README branches
on:
  push:
    branches: [main, feat/readme-square-kufic]
    paths: [.github/workflows/cleanup-readme.yml]
permissions:
  contents: read
jobs:
  cleanup:
    if: github.repository == 'akin-demir/arabic-calligraphy-skill' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/readme-square-kufic')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Remove only the superseded and merged README branches
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: python scripts/cleanup_readme_branches.py --apply
