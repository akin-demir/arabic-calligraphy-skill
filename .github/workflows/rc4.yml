name: Publish authorized RC4
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rc4.yml
      - release-plan.json
permissions:
  contents: read
concurrency:
  group: release-v0.1.0-rc.4
  cancel-in-progress: false
jobs:
  build-candidate:
    if: github.repository == 'akin-demir/arabic-calligraphy-skill'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangocairo-1.0-0 libcairo2 libfontconfig1 libharfbuzz0b
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install --no-deps .
      - run: python scripts/check_project.py
      - run: python scripts/verify_accuracy.py --candidate
      - run: pip-audit -r requirements-dev.txt
      - run: python scripts/generate_gallery.py
      - run: python -m build --no-isolation
      - name: Bundle exact source and checksums
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: python scripts/prepare_candidate.py --commit "$SOURCE_COMMIT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rc4-bundle
          path: candidate/
          if-no-files-found: error
  publish-prerelease:
    needs: build-candidate
    if: github.ref == 'refs/heads/main' && github.repository == 'akin-demir/arabic-calligraphy-skill'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: rc4-bundle
          path: candidate
      - name: Publish exactly the owner-authorized prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          sha256sum -c SHA256SUMS
          python -c 'import json,os; m=json.load(open("release-manifest.json")); assert m["tag"]=="v0.1.0-rc.4" and m["commit"]==os.environ["SOURCE_COMMIT"]'
          if gh release view v0.1.0-rc.4 >/dev/null 2>&1; then
            echo 'RC4 already exists; refusing to overwrite an existing release.'
            exit 1
          fi
          gh api --method POST "repos/$GH_REPO/git/refs" -f ref=refs/tags/v0.1.0-rc.4 -f sha="$SOURCE_COMMIT"
          gh release create v0.1.0-rc.4 --verify-tag --target "$SOURCE_COMMIT" --prerelease --latest=false --title 'v0.1.0-rc.4 — Square Kufic README candidate' --notes-file release-notes.md ./*
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Remove only completed inactive feature branches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: python scripts/cleanup_rc4_branches.py --apply
