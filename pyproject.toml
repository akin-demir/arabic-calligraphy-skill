[build-system]
requires = ["setuptools>=77,<85", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "arabic-calligraphy-skill"
version = "0.1.0rc4"
description = "Honest Arabic typography workflows for AI agents"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
dependencies = ["fonttools>=4.61.1,<5", "pypdf>=6.21.4,<8"]

[project.optional-dependencies]
dev = ["build==1.6.1", "pypdf==7.0.1", "Pillow==13.0.0", "PyYAML==6.0.3"]

[project.scripts]
arabic-calligraphy = "arabic_calligraphy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
arabic_calligraphy = ["data/*.json", "data/fonts/*"]
